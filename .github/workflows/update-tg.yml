name: Update Telegram Feed

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh Telegram channel feed & avatar
        run: node scripts/update-tg-feed.mjs

      - name: Commit updated feed if changed
        run: |
          if [ -n "$(git status --porcelain data/tg.json assets/avatar.jpg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tg.json assets/avatar.jpg
            git commit -m "chore: update @heleNyssss feed [skip ci]"
            git push
          fi
