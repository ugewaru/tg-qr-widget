<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Telegram iOS QR Widget</title>
    <link rel="preconnect" href="https://ws-us2.pusher.com" crossorigin />
    <link rel="preconnect" href="https://ntfy.sh" crossorigin />
    <style>:root {
  color-scheme: dark;
  --ae-glow-boost: 1;
}

@property --qr-shimmer-angle {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

@keyframes qr-shimmer-spin {
  to {
    --qr-shimmer-angle: 360deg;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

body.is-preview {
  background:
    radial-gradient(circle at 22% 24%, rgba(46, 166, 255, 0.14), transparent 45%),
    radial-gradient(circle at 80% 74%, rgba(245, 158, 11, 0.14), transparent 46%),
    #0e1118;
}

.overlay-root {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 20px 28px 34px;
  pointer-events: none;
}

body.is-pos-center .overlay-root {
  align-items: center;
  padding: 24px;
}

.stage-scale-box {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  transform-origin: center bottom;
}

body.is-pos-center .stage-scale-box {
  align-items: center;
  transform-origin: center center;
}

.qr-stage {
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.qr-stage.is-hidden {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

/* ---------------- Centered iOS QR + Shimmering AE Aura + Transparent Tag ---------------- */
.qr-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 10px;
}

.qr-unit {
  position: relative;
  width: 264px;
  height: 264px;
  display: grid;
  place-items: center;
  will-change: transform, opacity;
  backface-visibility: hidden;
  transform-origin: center center;
}

.qr-aura-video {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 436px;
  height: 436px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 0;
  opacity: calc(0.95 * var(--ae-glow-boost, 1));
}

.qr-shimmer-rim {
  position: absolute;
  inset: -4px;
  border-radius: 42px;
  z-index: 1;
  pointer-events: none;
  background: conic-gradient(
    from var(--qr-shimmer-angle),
    #ffe066 0deg,
    #ffb703 65deg,
    #fb8500 135deg,
    #ea580c 200deg,
    #fff3b0 265deg,
    #f59e0b 320deg,
    #ffe066 360deg
  );
  opacity: calc(0.9 * var(--ae-glow-boost, 1));
  filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.56));
  animation: none;
}

@media (prefers-reduced-motion: no-preference) {
  .qr-shimmer-rim {
    animation: qr-shimmer-spin 4.2s linear infinite;
  }
}

:root[data-force-motion="1"] .qr-shimmer-rim {
  animation: qr-shimmer-spin 4.2s linear infinite;
}

:root[data-force-motion="0"] .qr-shimmer-rim,
:root[data-media-paused="1"] .qr-shimmer-rim {
  animation: none;
}

.qr-card {
  position: relative;
  z-index: 2;
  width: 264px;
  height: 264px;
  border-radius: 38px;
  background: #ffffff;
  padding: 15px;
  box-shadow:
    0 18px 46px rgba(0, 0, 0, 0.48),
    inset 0 0 0 1px rgba(255, 255, 255, 0.94);
  display: grid;
  place-items: center;
}

.qr-frame {
  position: relative;
  width: 234px;
  height: 234px;
  display: grid;
  place-items: center;
}

.qr-svg-host {
  width: 100%;
  height: 100%;
}

.qr-svg-host svg {
  display: block;
  width: 100%;
  height: 100%;
}

.qr-center-avatar-wrap {
  position: absolute;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #ffffff;
  padding: 3px;
  box-shadow: 0 2px 10px rgba(194, 65, 12, 0.28);
  display: grid;
  place-items: center;
}

.qr-center-avatar,
.qr-center-fallback {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  color: #ffffff;
  font-size: 18px;
  font-weight: 800;
}

.qr-center-avatar[hidden],
.qr-center-fallback[hidden] {
  display: none;
}

.qr-tag {
  margin-top: 15px;
  background: transparent;
  color: #ffffff;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.1;
  text-shadow:
    0 2px 10px rgba(0, 0, 0, 0.92),
    0 0 22px rgba(0, 0, 0, 0.72),
    0 1px 2px rgba(0, 0, 0, 0.98);
  will-change: transform, opacity;
  backface-visibility: hidden;
  transform-origin: center top;
}

/* ---------------- Preview Control HUD (?preview=1 only) ---------------- */
.preview-hud {
  position: fixed;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 16px;
  background: rgba(15, 23, 36, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  color: #e2e8f0;
  font-size: 13px;
  pointer-events: auto;
  z-index: 50;
}

.preview-hud[hidden] {
  display: none;
}

.preview-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  font-size: 12px;
  font-weight: 600;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #f59e0b;
}

.status-dot.is-online {
  background: #53fc18;
  box-shadow: 0 0 8px rgba(83, 252, 24, 0.6);
}

.hud-btn {
  appearance: none;
  text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.08);
  color: #f8fafc;
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.hud-btn:hover {
  background: rgba(255, 255, 255, 0.15);
}

.hud-btn.is-primary {
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  border-color: rgba(251, 146, 60, 0.7);
  color: #ffffff;
}

.hud-btn.is-danger {
  background: rgba(220, 38, 38, 0.25);
  border-color: rgba(248, 113, 113, 0.45);
  color: #fecaca;
}

@media (max-width: 820px) {
  .stage-scale-box {
    transform: scale(0.84);
  }
}

@media (max-width: 660px) {
  .stage-scale-box {
    transform: scale(0.64);
  }
}
</style>
  </head>
  <body>
    <div id="previewHud" class="preview-hud" hidden>
      <div class="preview-group">
        <span class="status-badge">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Инициализация…</span>
        </span>
      </div>
      <div class="preview-group">
        <button id="btnTestShow" class="hud-btn is-primary" type="button">Показать (!qr)</button>
        <button id="btnTestHide" class="hud-btn is-danger" type="button">Скрыть (!qr off)</button>
        <button id="btnToggleMedia" class="hud-btn" type="button" aria-pressed="false">Пауза анимации</button>
        <a id="hudPanelLink" class="hud-link hud-btn" href="./panel/">Открыть панель</a>
      </div>
    </div>

    <div class="overlay-root">
      <div id="stageScaleBox" class="stage-scale-box">
        <div id="qrStage" class="qr-stage is-hidden" aria-live="polite">
          <div class="qr-column">
            <div id="qrUnit" class="qr-unit">
              <video
                id="qrAuraVideo"
                class="qr-aura-video"
                src="./assets/qr-aura.webm"
                muted
                loop
                playsinline
                autoplay
                preload="auto"
              ></video>
              <div class="qr-shimmer-rim" aria-hidden="true"></div>
              <div class="qr-card" aria-label="QR-код Telegram-канала">
                <div class="qr-frame">
                  <div id="qrSvgHost" class="qr-svg-host" aria-hidden="true"></div>
                  <div id="qrCenterAvatarWrap" class="qr-center-avatar-wrap">
                    <img id="qrCenterAvatar" class="qr-center-avatar" src="./assets/avatar.jpg" alt="" />
                    <span id="qrCenterFallback" class="qr-center-fallback" hidden>HN</span>
                  </div>
                </div>
              </div>
            </div>

            <div id="qrTag" class="qr-tag">@heleNyssss</div>
          </div>
        </div>
      </div>
    </div>
